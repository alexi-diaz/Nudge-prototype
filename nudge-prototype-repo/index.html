<style>/* =============================================================================
   QBM PROTOTYPE KIT — DESIGN TOKENS  (single source of truth)
   Every section references these variables. Never hardcode hex / px / font
   values in a section — change it here and it propagates to all screens, which
   is what keeps the merged prototype consistent.

   ⚠ FIGMA SYNC — these values are SEEDED from the current onboarding prototype,
   which already follows the "Mobile Freemium Provocation 2026" direction. Before
   the merge, reconcile the exact names + values against Figma:
     • Colors:     node 212-26886  (color token / variable frame)
     • Typography: node 252-13724  (type spec frame)
   Update the PRIMITIVES block below and the whole kit updates. Do not scatter
   overrides into sections.
   ============================================================================= */

:root{
  /* ---- PRIMITIVES : brand palette (reconcile w/ Figma 212-26886) ------------ */
  --qb-green-900:#003E31;   /* brand / primary green            */
  --qb-green-accent:#5BEF76;/* bright accent green              */
  --qb-ink:#13221D;         /* near-black text                  */
  --qb-muted:#8A9992;       /* secondary text                   */
  --qb-field:#F0F4F6;       /* filled input / chip surface      */
  --qb-surface-2:#F3F5F4;   /* subtle raised surface (bubbles)  */
  --qb-stroke:#D8DFDB;      /* hairline borders                 */
  --qb-cta:#111315;         /* neutral/dark fill (optional)     */
  --qb-me:#16241F;          /* dark bubble                      */
  --qb-success:#34C759;     /* iOS green (send / confirm)       */
  --qb-danger:#E5484D;      /* error (add to Figma if missing)  */
  --qb-warning:#F5A623;     /* warning (add to Figma if missing)*/
  --qb-white:#FFFFFF;
  --qb-canvas:#E7EBE9;      /* stage behind the device          */

  /* aurora accent stops (launch / onboarding background) */
  --aurora-1:#7FB6FF; --aurora-2:#72E4D0; --aurora-3:#AEEAC4;

  /* ---- SEMANTIC : use THESE in sections, not the primitives ---------------- */
  --color-brand:var(--qb-green-900);
  --color-accent:var(--qb-green-accent);
  --color-text:var(--qb-ink);
  --color-text-muted:var(--qb-muted);
  --color-surface:var(--qb-white);
  --color-surface-alt:var(--qb-field);
  --color-surface-raised:var(--qb-surface-2);
  --color-border:var(--qb-stroke);
  --color-cta:var(--qb-green-900);   /* PRIMARY CTA = brand green #003E31     */
  --color-cta-text:var(--qb-white);
  --color-cta-dark:var(--qb-cta);    /* optional dark/neutral button          */
  --color-on-brand:var(--qb-white);
  --color-success:var(--qb-success);
  --color-danger:var(--qb-danger);
  --color-warning:var(--qb-warning);
  --color-link:var(--qb-green-900);

  /* ---- TYPOGRAPHY (reconcile w/ Figma 252-13724) --------------------------- */
  /* Tally ships Regular(400) + Medium(600) only. 600 is the heaviest weight.   */
  --font-sans:'Tally',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fw-regular:400;
  --fw-medium:600;   /* "semibold/bold" in this system = Medium 600            */

  /* Type ramp — {weight size/line-height letter-spacing}. iOS-aligned.        */
  --type-display:var(--fw-medium) 34px/1.08 var(--font-sans);   /* hero        */
  --type-title:var(--fw-medium) 28px/1.14 var(--font-sans);     /* screen title*/
  --type-title-ls:-0.02em;
  --type-headline:var(--fw-medium) 20px/1.25 var(--font-sans);  /* section head*/
  --type-body:var(--fw-regular) 16px/1.44 var(--font-sans);     /* body        */
  --type-body-emph:var(--fw-medium) 16px/1.44 var(--font-sans); /* AI text/emph*/
  --type-callout:var(--fw-regular) 15px/1.33 var(--font-sans);
  --type-subhead:var(--fw-medium) 14px/1.3 var(--font-sans);
  --type-footnote:var(--fw-regular) 13px/1.3 var(--font-sans);
  --type-caption:var(--fw-medium) 12px/1.2 var(--font-sans);
  --tracking-tight:-0.01em;

  /* ---- RADII : 8 / 16 / 24 scale — prefer 24 on large surfaces ------------- */
  --radius-sm:8px;          /* chips, icon tiles, inner list segments          */
  --radius-md:16px;         /* inputs, medium tiles                            */
  --radius-lg:24px;         /* cards, sheets, large surfaces (default)         */
  --radius-pill:999px;      /* buttons / CTAs are full pills                    */
  /* semantic aliases */
  --radius-card:var(--radius-lg);   /* 24 */
  --radius-field:var(--radius-md);  /* 16 */
  --radius-sheet:var(--radius-lg);  /* 24 */
  --radius-chip:var(--radius-sm);   /* 8  */
  --radius-tile:var(--radius-sm);   /* small icon tile */

  /* ---- SPACING (4pt grid) -------------------------------------------------- */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;
  --gutter:20px;            /* default screen side padding                      */

  /* ---- ELEVATION ----------------------------------------------------------- */
  --shadow-card:0 1px 2px rgba(0,25,18,.04),0 8px 24px rgba(0,25,18,.06);
  --shadow-sheet:0 -8px 40px rgba(0,25,18,.16);
  --shadow-pop:0 12px 32px rgba(0,25,18,.18);

  /* ---- MOTION -------------------------------------------------------------- */

<style>/* =============================================================================
   DEVICE FRAME — iPhone 17 / iOS 27

   ============================================================================= */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}

.stage{display:flex;flex-direction:column;align-items:center;gap:14px;}

.device{
  position:relative;
  width:calc(var(--screen-w) + var(--bezel) * 2);
  height:calc(var(--screen-h) + var(--bezel) * 2);
  border-radius:var(--device-radius);
  background:#0a0a0c;padding:var(--bezel);
  box-shadow:0 20px 50px rgba(0,25,18,.2);
}
/* Dynamic Island cutout */
.island{
  position:absolute;top:13px;left:50%;transform:translateX(-50%);
  width:var(--island-w);height:var(--island-h);
  background:#000;border-radius:20px;z-index:60;
}
.island::after{ /* front camera dot */
  content:"";position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:9px;height:9px;border-radius:50%;
  background:#15161a;box-shadow:inset 0 0 0 1.5px #050506;
}
.screen{
  position:relative;width:100%;height:100%;
  border-radius:var(--screen-radius);overflow:hidden;
  background:var(--color-surface);isolation:isolate;

.kit-app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;z-index:1;-webkit-overflow-scrolling:touch;}
.kit-app::-webkit-scrollbar{display:none;}

.statusbar{
  position:absolute;top:0;left:0;right:0;height:var(--statusbar-h);
  z-index:50;pointer-events:none;
}
.statusbar > svg{display:block;width:100%;height:auto;}
/* iOS behavior: on a dark background, status content turns white.
   Toggle with Kit.statusBar('dark') / ('light'). Default = light bg / dark content. */
.statusbar.on-dark svg path,
.statusbar.on-dark svg rect{fill:#fff;}
.statusbar.on-dark svg rect[stroke]{stroke:#fff;}

/* ---- home indicator ------------------------------------------------------ */
.homebar{
  position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
  width:130px;height:5px;border-radius:3px;background:rgba(0,0,0,.26);z-index:95;
}

.aurora{
  position:absolute;top:0;left:0;right:0;height:330px;z-index:0;overflow:hidden;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0%,rgba(0,0,0,.55) 42%,transparent 78%);
          mask:linear-gradient(#000 0%,rgba(0,0,0,.55) 42%,transparent 78%);
  opacity:.9;
}
.screen.no-aurora .aurora{display:none;}
.aurora i{position:absolute;border-radius:50%;filter:blur(46px);will-change:transform;}
.aurora .a1{width:270px;height:210px;top:-96px;left:-50px;background:var(--aurora-1);opacity:.42;animation:au1 27s ease-in-out infinite;}
.aurora .a2{width:250px;height:210px;top:-116px;left:120px;background:var(--aurora-2);opacity:.40;animation:au2 33s ease-in-out infinite;}
.aurora .a3{width:230px;height:190px;top:-86px;left:250px;background:var(--aurora-3);opacity:.34;animation:au3 30s ease-in-out infinite;}
@keyframes au1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,26px)}}
@keyframes au2{0%,100%{transform:translate(0,0)}50%{transform:translate(-34px,30px)}}
@keyframes au3{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,-18px)}}

/* =============================================================================
   OPTIONAL COMPONENT — iOS 27 frosted top bar
   Use for a screen nav/title bar. Content scrolls UNDER it (give your scroll
   content padding-top:112px). Build it with Kit.topBar(...) or copy this markup:
     <div class="topbar"><div class="tb-blur"></div><div class="tb-tint"></div>
       <div class="topbar-row"> …title / back / actions … </div></div>
   ============================================================================= */
.topbar{position:absolute;top:0;left:0;right:0;z-index:55;pointer-events:none;}
.topbar .topbar-row{position:relative;z-index:3;pointer-events:auto;
  display:flex;align-items:center;gap:12px;min-height:44px;padding:calc(var(--safe-top) + 4px) 20px 8px;}
.tb-blur{position:absolute;top:0;left:0;right:0;height:122px;z-index:0;
  -webkit-backdrop-filter:blur(26px) saturate(115%);backdrop-filter:blur(26px) saturate(115%);
  -webkit-mask:linear-gradient(180deg,#000 0%,#000 78%,rgba(0,0,0,.5) 91%,transparent 100%);
          mask:linear-gradient(180deg,#000 0%,#000 78%,rgba(0,0,0,.5) 91%,transparent 100%);}

.fh .tdy b{font:var(--fw-ids-medium) 14px/1 var(--font-ids);}
.fh .feed{position:relative;display:flex;flex-direction:column;gap:12px;}
.fh .wd{background:var(--color-surface);border:.5px solid var(--color-container-border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;}
.fh .wd .wh{display:flex;flex-direction:column;gap:2px;}
.fh .wd .wt{display:flex;justify-content:space-between;align-items:center;font:var(--fw-ids-medium) 16px/1.5 var(--font-ids);color:var(--color-text-primary);}
.fh .wd .ws{font:400 12px/1.5 var(--font-ids);color:var(--color-text-secondary);}
.fh .badge{font:var(--fw-ids-medium) 11px/1 var(--font-ids);background:var(--color-badge-bg);color:var(--color-badge-text);padding:4px 6px;border-radius:4px;}
.fh .bar{height:16px;background:var(--color-track);border-radius:2px;position:relative;}
.fh .bar i{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--color-track-fill);border-radius:2px;}
.fh .segbar{display:flex;gap:2px;height:16px;}
.fh .segbar i{flex:1;background:var(--color-track);}
.fh .figs{display:flex;justify-content:space-between;font:var(--fw-ids-medium) 14px/1.5 var(--font-ids);color:var(--color-text-primary);}
.fh .figs small{display:block;font:400 12px/1.5 var(--font-ids);color:var(--color-text-secondary);}
.fh .figs div:last-child{text-align:right;}
.fh .ob{height:36px;width:100%;border-radius:var(--radius-btn-ids);background:var(--color-surface);border:1px solid var(--color-btn-outline);color:var(--color-btn-outline);font:var(--fw-ids-medium) 16px/1 var(--font-ids);cursor:pointer;}
.fh .wd .rw{display:flex;align-items:center;justify-content:space-between;font:var(--fw-ids-medium) 14px/1.5 var(--font-ids);color:var(--color-text-primary);}
.fh .wd .dv{height:.5px;background:var(--color-divider);}
.fh .wd .rows{display:flex;flex-direction:column;gap:8px;}
.fh .logos{display:flex;align-items:center;height:28px;}
.fh .logos i{width:28px;height:28px;border-radius:50%;margin-right:-12px;display:flex;align-items:center;justify-content:center;font:700 8px/1 var(--font-ids);color:#fff;font-style:normal;box-shadow:0 0 0 1.5px var(--color-surface);}
.fh .cat{display:flex;align-items:center;gap:8px;font:400 14px/1.5 var(--font-ids);color:var(--color-text-primary);}
.fh .cat u{width:8px;height:8px;background:var(--color-track-fill);opacity:.5;}
.fh .cat span{margin-left:auto;}
.fh .lbl{font:400 12px/1.5 var(--font-ids);color:var(--color-text-secondary);}
.fh .big{font:var(--fw-ids-medium) 30px/1.2 var(--font-ids);color:var(--color-text-primary);}
.fh .rng{display:flex;justify-content:space-between;font:400 12px/1 var(--font-ids);color:var(--color-text-secondary);}
.fh .rng span{padding:6px 9px;border-radius:var(--radius-pill);}
.fh .rng span.on{background:var(--color-track);color:var(--color-text-primary);font-weight:var(--fw-ids-medium);}

.fh .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fh .two .wd{padding:14px;}
.fab{position:absolute;right:25px;bottom:104px;width:54px;height:54px;border-radius:50%;background:var(--color-brand);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 15px rgba(0,0,0,.1);z-index:5;cursor:pointer;}
/* Liquid-glass tab bar (Figma 18881:160334) */
.tabs{position:absolute;left:29px;right:29px;bottom:29px;height:54px;display:flex;align-items:center;padding:0 2px;z-index:4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",var(--font-ids);}
.tabs .glass{position:absolute;inset:-4px;border-radius:var(--radius-pill);
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(236,236,238,.55));
  backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
  box-shadow:1.25px 0 0 -.75px #D0D0D0,-1.25px 0 0 -.75px #D0D0D0,0 0 0 .5px #E8E8E8,0 8px 15px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.8);}
.tabs .tab{position:relative;flex:1;height:54px;margin-right:-8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 8px 7px;color:#000;cursor:pointer;}
.tabs .tab:last-child{margin-right:0;}
.tabs .tab b{position:relative;font:590 10px/12px -apple-system,BlinkMacSystemFont,"SF Pro Text",var(--font-ids);}
.tabs .tab svg,.tabs .tab .av{position:relative;margin-bottom:2px;}
.tabs .tab.on svg{color:var(--color-brand);}
.tabs .tab .sel{position:absolute;inset:0 -2px;border-radius:100px;background:#EDEDED;}

  <script>/* =============================================================================
   KIT RUNTIME  (classic script — attaches window.Kit; no build step, no modules)
   Sections register screens into a shared registry; the router mounts them into
   #app. This registry is what lets independently-built sections merge into ONE
   prototype: each section only adds to Kit, it never edits another section.

   A section file looks like:

     Kit.register('receipts', {
       title:'Receipts', icon:'receipt',
       home:'inbox',                       // default screen id
       screens:{
         inbox:  (data)=> Kit.el('div','screen-pad', '<h1 class="t-title">Receipts</h1>'),
         detail: (data)=> ...
       }
     });

   Navigate with Kit.nav('receipts.detail', {id:3}). See AGENTS.md for rules.
   ============================================================================= */
window.Kit = (function(){
  const sections = {};        // id -> def
  const screens  = {};        // "section.screen" -> fn(data)->Node
  let currentFq  = null;
  const stack    = [];        // simple nav history for back()

  /* ---- registry --------------------------------------------------------- */
  function register(id, def){
    if(sections[id]) console.warn('[Kit] section already registered:', id);
    sections[id] = def;
    Object.keys(def.screens||{}).forEach(k=>{ screens[id+'.'+k] = def.screens[k]; });
  }

  /* ---- tiny DOM helper -------------------------------------------------- */
  function el(tag, cls, html){
    const e=document.createElement(tag);
    if(cls) e.className=cls;
    if(html!=null) e.innerHTML=html;
    return e;
  }
  function app(){ return document.getElementById('app'); }

  /* ---- mount + navigation ---------------------------------------------- */
  function render(fq, data){
    const fn = screens[fq];
    const host = app();
    host.innerHTML='';
    if(!fn){ host.appendChild(el('div','kit-empty','Screen not found: <b>'+fq+'</b>')); return; }
    currentFq = fq;
    statusBar('light');                 // default each screen to light bg; builder may override
    host.appendChild(fn(data||{}));
    host.scrollTop = 0;
  }
  // iOS status bar color: bg 'dark' -> white content, bg 'light' -> dark content
  function statusBar(bg){
    const sb=document.getElementById('statusbar');
    if(sb) sb.classList.toggle('on-dark', bg==='dark');
  }
  // push with a subtle iOS slide
  function nav(fq, data){
    if(currentFq) stack.push(currentFq);
    slide(()=>render(fq,data),'fwd');
  }
  function back(){
    const prev = stack.pop();
    if(prev) slide(()=>render(prev),'back'); else launcher();
  }
  function replace(fq, data){ render(fq, data); }
  function slide(paint, dir){
    const host = app();
    host.style.transition='none';
    host.style.transform = dir==='back' ? 'translateX(-14px)' : 'translateX(14px)';
    host.style.opacity='0';
    paint();
    requestAnimationFrame(()=>{
      host.style.transition='transform var(--dur) var(--ease-ios),opacity var(--dur)';
      host.style.transform='translateX(0)';
      host.style.opacity='1';
    });
  }

  /* ---- reusable chrome -------------------------------------------------- */
  // iOS 27 frosted top bar with optional back button + right actions
  function topBar(opts){
    opts=opts||{};
    const bar=el('div','topbar');
    bar.innerHTML='<div class="tb-blur"></div><div class="tb-tint"></div>';
    const row=el('div','topbar-row');
    if(opts.back){ const b=el('button','icon-btn plain'); b.innerHTML=icon('chevron-left',22);
      b.onclick=opts.onBack||back; row.appendChild(b); }
    row.appendChild(el('div','title', opts.title||''));
    row.appendChild(el('div','spacer'));
    (opts.actions||[]).forEach(a=>row.appendChild(a));
    bar.appendChild(row);
    return bar;
  }
  // bottom sheet; returns {close}
  function sheet(node){
    const scr=el('div','sheet-scrim'), s=el('div','sheet');
    s.appendChild(el('div','grabber'));
    s.appendChild(node);
    scr.appendChild(s);
    document.querySelector('.screen').appendChild(scr);
    requestAnimationFrame(()=>{scr.classList.add('show');s.classList.add('show');});
    function close(){ scr.classList.remove('show');s.classList.remove('show');
      setTimeout(()=>scr.remove(),420); }
    scr.onclick=e=>{ if(e.target===scr) close(); };
    return {close, el:s};
  }

  /* ---- icon set (stroke, 24px grid). Add shared icons here. ------------- */
  const P = {
    'chevron-left':'<path d="M15 5l-7 7 7 7"/>',
    'chevron-right':'<path d="M9 5l7 7-7 7"/>',
    'plus':'<path d="M12 5v14M5 12h14"/>',
    'check':'<path d="M4 12l5 5L20 6"/>',
    'camera':'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/>',
    'receipt':'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    'invoice':'<path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/>',
    'card':'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
    'sparkle':'<path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15l-1.8-4.2L5.5 9l4.7-1.3z"/>',
    'home':'<path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/>',
    'dollar':'<path d="M12 3v18M8 7h6a2.5 2.5 0 010 5H9a2.5 2.5 0 000 5h7"/>',
    'chart':'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
  };
  function icon(name, size){
    size=size||24;
    const d=P[name]||'';
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" '+
      'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
  }

  /* ---- launcher (merged home of the kit) -------------------------------- */
  function launcher(){
    const host=app(); host.innerHTML='';
    const wrap=el('div','launcher');
    wrap.innerHTML='<h1>QuickBooks</h1><p class="t-foot">Prototype kit — pick a section</p>';
    const grid=el('div','grid');
    Object.keys(sections).forEach(id=>{
      const def=sections[id];
      const tile=el('div','tile');
      tile.innerHTML='<div class="badge">'+icon(def.icon||'home',20)+'</div><div class="name">'+(def.title||id)+'</div>';
      tile.onclick=()=>{ stack.length=0; render(id+'.'+(def.home||Object.keys(def.screens)[0])); };
      grid.appendChild(tile);
    });
    wrap.appendChild(grid);
    host.appendChild(wrap);
    currentFq=null;
  }

  /* ---- boot : read ?section= / ?screen= --------------------------------- */
  function boot(){
    const p=new URLSearchParams(location.search);
    const sec=p.get('section'), scr=p.get('screen');
    if(sec && sections[sec]){
      const def=sections[sec];
      render(sec+'.'+(scr||def.home||Object.keys(def.screens)[0]));
    } else {
      launcher();
    }
  }

  return { register, el, icon, nav, back, replace, render, topBar, sheet, statusBar, launcher, boot,
           sections, screens };
})();
</script>

    if(i) feed.appendChild(nudgeCard(i));
    const tmp = Kit.el('div','', (LAYOUT[i?i.id:'none']).map(k=>{const [n,f]=k.split(':');return W[n](!!f);}).join(''));
    while(tmp.firstChild) feed.appendChild(tmp.firstChild);
    return s;
  }

  Kit.register('nudge', {
    title:'Post-onboarding nudge', icon:'sparkle', home:'picker',
    screens:{
      /* 1. Intent picker (from Figma screenshot) */
      picker: (data) => {
        const s = scr('picker');
        let sel = data && data.sel || null;
        s.innerHTML =
          '<div class="pk-top"><button class="back" aria-label="Back">'+Kit.icon('chevron-left',24)+'</button>'+
          '<span class="t">Get started</span>'+
          '<button class="x" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>'+
          '<div class="pk-prog"><i></i></div>'+
          '<h1>What should we start with today?</h1>'+
          '<div class="pk-list"></div><div class="pk-fade"></div>'+
          '<button class="pk-cta">Next</button>';
        const list = s.querySelector('.pk-list'), cta = s.querySelector('.pk-cta');
        INTENTS.forEach(i=>{
          const o = Kit.el('div','opt'+(sel===i.id?' sel':''),
            '<img src="data:image/png;base64,'+window.__IMG[i.id]+'" alt=""><span>'+i.label+'</span>');
          o.onclick = () => {
            sel = i.id;
            list.querySelectorAll('.opt').forEach(n=>n.classList.remove('sel'));
            o.classList.add('sel'); cta.classList.add('on');
          };
          list.appendChild(o);
        });
        if(sel) cta.classList.add('on');
        cta.onclick = () => Kit.nav('nudge.home', { intent: sel });
        s.querySelector('.x').onclick = () => Kit.nav('nudge.home', { intent: null });
        s.querySelector('.back').onclick = () => Kit.replace('nudge.picker', { sel });
        return s;
      },

      /* 2. Homepage with the intent's nudge card */
      home: (data) => fullHome(data && data.intent ? byId[data.intent] : null),

      /* 3. Destination stub — end of prototype scope */
      dest: (data) => {
        const i = byId[data.intent];
        const s = scr('stub');
        s.innerHTML =
          '<div class="ok">'+Kit.icon('check',30)+'</div>'+
          '<h2>'+i.nudge.dest+'</h2>'+
          '<p>This is where the “'+i.nudge.cta+'” flow would start. Not part of this prototype.</p>'+
          '<button class="go">Back to home</button>';
        s.querySelector('.go').onclick = () => Kit.render('nudge.home', { intent:null });
        return s;
      }
    }
  });

  /* review-only helpers for the switcher outside the device */
  window.Nudge = {
    intents: INTENTS,
    jump: (id) => Kit.render('nudge.home', { intent:id }),
    restart: () => Kit.render('nudge.picker')
  };
})();

  <script>
  Kit.render('nudge.picker');
  (function(){var r=document.getElementById('review');
    var b=document.createElement('button');b.textContent='\u21BA Restart at intent picker';b.onclick=Nudge.restart;r.appendChild(b);
    Nudge.intents.forEach(function(i){var x=document.createElement('button');x.textContent=i.label;x.onclick=function(){Nudge.jump(i.id)};r.appendChild(x);});})();
</script>
